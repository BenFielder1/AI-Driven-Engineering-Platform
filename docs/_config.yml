# Tevrin docs site (FR-225, FR-226, SPEC D-V6-4). Built from docs/ by .github/workflows/docs.yml and published to
# GitHub Pages at the custom domain https://docs.tevrin.dev/ (D-V6-22), served from the site root (empty baseurl).
title: Tevrin docs
description: Documentation for Tevrin, AI-driven software delivery with a governed lifecycle, approval gates and an audit trail.
url: https://docs.tevrin.dev
baseurl: ""

theme: just-the-docs
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
strict_front_matter: true

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

logo: /0.6.0/brand/tevrin-lockup-light.svg

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
enable_copy_code_button: true

# Mermaid diagrams in ```mermaid fences, loaded as ESM from jsDelivr (pinned).
mermaid:
  version: "11.17.2"

aux_links:
  "Tevrin on GitHub":
    - "https://github.com/BenFielder1/AI-Driven-Engineering-Platform"
aux_links_new_tab: false

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/BenFielder1/AI-Driven-Engineering-Platform"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - Gemfile
  - Gemfile.lock
  - .bundle/
  - vendor/
  - .jekyll-cache/
  - .sass-cache/
  - node_modules/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Frozen version docs docs/0.1.0-0.5.0 (CLAUDE.md, SPEC D-V6-13): never edited, so no front matter. Built as plain pages
  # (jekyll-optional-front-matter), kept out of the nav and search (linked from history/), and not run through Liquid
  # because they contain literal `{{ ... }}` (prompt placeholders, Railway `${{ ... }}` references).
  - scope:
      path: "0.1.0"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false
  - scope:
      path: "0.2.0"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false
  - scope:
      path: "0.3.0"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false
  - scope:
      path: "0.4.0"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false
  - scope:
      path: "0.5.0"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false
  # D-V6-26: the version folders were renamed from vN to x.y.z. The old URLs of the frozen pages redirect here,
  # because their files can't take front matter; the history pages carry their own redirect_from.
  - scope:
      path: "0.1.0/PROGRESS.md"
    values:
      redirect_from: /v1/PROGRESS/
  - scope:
      path: "0.1.0/SPEC.md"
    values:
      redirect_from: /v1/SPEC/
  - scope:
      path: "0.2.0/PROGRESS.md"
    values:
      redirect_from: /v2/PROGRESS/
  - scope:
      path: "0.2.0/SPEC.md"
    values:
      redirect_from: /v2/SPEC/
  - scope:
      path: "0.3.0/PROGRESS.md"
    values:
      redirect_from: /v3/PROGRESS/
  - scope:
      path: "0.3.0/SPEC.md"
    values:
      redirect_from: /v3/SPEC/
  - scope:
      path: "0.4.0/DRAFT_SPEC.md"
    values:
      redirect_from: /v4/DRAFT_SPEC/
  - scope:
      path: "0.4.0/PROGRESS.md"
    values:
      redirect_from: /v4/PROGRESS/
  - scope:
      path: "0.4.0/SPEC.md"
    values:
      redirect_from: /v4/SPEC/
  - scope:
      path: "0.5.0/COMMIT_CO_AUTHORSHIP.md"
    values:
      redirect_from: /v5/COMMIT_CO_AUTHORSHIP/
  - scope:
      path: "0.5.0/ISSUE_TRACKER_CONNECTIONS.md"
    values:
      redirect_from: /v5/ISSUE_TRACKER_CONNECTIONS/
  - scope:
      path: "0.5.0/MICROSOFT_AGENT_FRAMEWORK.md"
    values:
      redirect_from: /v5/MICROSOFT_AGENT_FRAMEWORK/
  - scope:
      path: "0.5.0/PROGRESS.md"
    values:
      redirect_from: /v5/PROGRESS/
  - scope:
      path: "0.5.0/SPEC.md"
    values:
      redirect_from: /v5/SPEC/
