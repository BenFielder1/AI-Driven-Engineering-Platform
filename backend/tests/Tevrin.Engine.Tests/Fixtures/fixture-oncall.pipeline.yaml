# Fixture pipeline (M71, FR-358, FR-359, FR-361): a signed alert webhook starts the run (FR-337). The investigator reads
# logs with a 'read' tool; the executor may restart a pod, a 'destructive' tool, so its stage raises the ceiling to
# destructive (tool_policy). Every restart-pod call waits on a tool_approval gate (FR-359, the runner steps).
pipeline: fixture-oncall
version: 1
title: Fixture on-call
trigger: { kind: webhook, input: alert, on_active: skip }
approval_modes: [strict, advisory, autonomous]
default_approval_mode: advisory
start: [investigate]

artifacts:
  alert:    { title: Alert, format: json, approval: auto_lock, cascade: downstream, input: true }
  findings: { title: Findings, format: markdown, approval: auto_lock, cascade: downstream }
  action:   { title: Action report, format: markdown, approval: auto_lock, cascade: none }

statuses:
  investigating: { generic: active }
  remediating:   { generic: active }

stages:
  - id: investigate
    title: Investigate
    status: investigating
    agent: { key: investigator, prompt: flow.oncall-investigate, tools: [flow.read-logs] }
    inputs: [alert]
    output: findings
    requires:
      - { input: alert }

  - id: remediate
    title: Remediate
    status: remediating
    agent: { key: executor, prompt: flow.oncall-execute, tools: [flow.read-logs, flow.restart-pod] }
    tool_policy: { max_tier: destructive }
    inputs: [alert, findings]
    output: action
