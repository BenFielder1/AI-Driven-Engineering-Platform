# Single entry point: serves the SPA and proxies /api (incl. WebSocket upgrade for /api/hubs/) to the api Service.
# Included inside the http {} block of the nginx-unprivileged image.
# Forwarded headers: the API runs with ASPNETCORE_FORWARDEDHEADERS_ENABLED=true (ForwardLimit 1), so it takes the
# right-most X-Forwarded-For entry, which is the one nginx appends ($remote_addr) -- a client-supplied XFF can't
# spoof the IP used by the per-IP login/register rate limits.
# Cookies: Set-Cookie / Cookie pass through untouched (no proxy_cookie_path / proxy_cookie_domain rewriting).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# NFR-SEC: one-click approval links carry a bearer token in the path (/approvals/<token> page, /api/approvals/<token>
# API). Access logs record the request URI and the Referer with that segment replaced by [redacted]; the log format is
# nginx's "combined" otherwise.
map $request_uri $aide_log_uri {
  "~*^(?<aide_uri_head>/(?:api/)?approvals/)[^/?#]+(?<aide_uri_tail>.*)$" "${aide_uri_head}[redacted]${aide_uri_tail}";
  default $request_uri;
}

map $http_referer $aide_log_referer {
  "~*^(?<aide_ref_head>[^?#]*?/(?:api/)?approvals/)[^/?#]+(?<aide_ref_tail>.*)$" "${aide_ref_head}[redacted]${aide_ref_tail}";
  default $http_referer;
}

log_format aide_redacted '$remote_addr - $remote_user [$time_local] "$request_method $aide_log_uri $server_protocol" '
                         '$status $body_bytes_sent "$aide_log_referer" "$http_user_agent"';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  client_max_body_size 10m;

  # Same stdout-linked file as the image default, with approval tokens redacted (see aide_redacted above).
  access_log /var/log/nginx/access.log aide_redacted;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # SignalR hubs: WebSocket upgrade + long-lived connections.
  location /api/hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # One-click approval API: same proxying as /api/, but nginx's error log (whose format can't be changed) would record
  # the token in its "request:" and "upstream:" fields, so only critical errors are logged here (NFR-SEC).
  location /api/approvals/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    error_log /var/log/nginx/error.log crit;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # NFR-SEC: the SPA loads only its own bundle (one external module script, one stylesheet, no inline script) and
    # talks only to same-origin /api (incl. the SignalR WebSocket: 'self' covers ws(s) on the same host). img-src
    # matches the Markdown view, which only loads same-origin and data: images. 'unsafe-inline' styles cover React
    # style attributes. Zod probes `Function("")` once and falls back when eval is blocked, so no 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
