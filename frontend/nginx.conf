# Single entry point: serves the SPA and proxies /api (incl. WebSocket upgrade for /api/hubs/) to the api Service.
# Included inside the http {} block of the nginx-unprivileged image.
# Forwarded headers: the API runs with ASPNETCORE_FORWARDEDHEADERS_ENABLED=true (ForwardLimit 1), so it takes the
# right-most X-Forwarded-For entry, which is the one nginx appends ($remote_addr) -- a client-supplied XFF can't
# spoof the IP used by the per-IP login/register rate limits.
# Cookies: Set-Cookie / Cookie pass through untouched (no proxy_cookie_path / proxy_cookie_domain rewriting).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # SignalR hubs: WebSocket upgrade + long-lived connections.
  location /api/hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # NFR-SEC: the SPA loads only its own bundle (one external module script, one stylesheet, no inline script) and
    # talks only to same-origin /api (incl. the SignalR WebSocket: 'self' covers ws(s) on the same host). img-src
    # matches the Markdown view, which only loads same-origin and data: images. 'unsafe-inline' styles cover React
    # style attributes. Zod probes `Function("")` once and falls back when eval is blocked, so no 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
