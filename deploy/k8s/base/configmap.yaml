# Non-secret settings shared by db, api, web (BACKEND_URL only) and the migration Job. Secrets come from app-secrets (overlay secretGenerator).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_DB: aide
  POSTGRES_USER: aide
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  # The API sits behind the web container's Next.js server (browser -> web -> api, one proxy hop); honour
  # X-Forwarded-* (built-in ASP.NET Core switch). ForwardedHeaders__ForwardLimit keeps its default of 1 (FR-105).
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Telemetry__ConsoleExporter: "false"
  # SPEC §8/§9: Data Protection keys persisted on the aide-data volume.
  DataProtection__KeysPath: /data/keys
  # Auth (phase 2). SameAsRequest: the local app is plain HTTP on localhost:8080; Secure cookies when served over HTTPS.
  Auth__Cookie__SecurePolicy: SameAsRequest
  # Per-client-IP fixed-window limits (IP from X-Forwarded-For set by the web server's /api proxy).
  Auth__RateLimits__LoginPerMinute: "5"
  Auth__RateLimits__RegisterPerMinute: "5"
  # web (FR-98, FR-104): server-side target of the /api proxy (incl. SignalR WebSockets), read at runtime.
  BACKEND_URL: http://api:8080
