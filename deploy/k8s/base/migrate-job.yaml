# Applies EF Core migrations with the bundle baked into the api image (same tag).
# Jobs are immutable: deploy-local.sh deletes the previous db-migrate before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for PostgreSQL so a cold start doesn't burn the Job's retries.
        - name: wait-for-db
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for db; sleep 2; done"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_USER }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: migrate
          image: aide-api
          imagePullPolicy: IfNotPresent
          command: ["/app/efbundle"]
          args: ["--connection", "$(ConnectionStrings__Aide)"]
          env:
            - name: ConnectionStrings__Aide
              valueFrom:
                secretKeyRef: { name: app-secrets, key: ConnectionStrings__Aide }
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
