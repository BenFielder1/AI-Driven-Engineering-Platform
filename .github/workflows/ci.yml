# Mirrors the CLAUDE.md gate, plus contract/client/route-tree freshness, EF model drift, CLI packaging, manifest
# validation (kubeconform), image build checks and a Playwright E2E run against the dev loop.
# Nothing is pushed: images are built and discarded. No registry, repository or LLM/GitHub secrets are used:
# E2E runs with the offline Fake LLM provider and the Local Git provider, and the database is a throwaway service.
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  backend:
    name: Backend (build, contract, EF drift, CLI pack, test, format)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Build (warnings as errors; regenerates openapi/api.json)
        run: dotnet build -c Release -warnaserror --no-restore
      - name: Contract is up to date (backend/openapi/api.json)
        run: bash ../scripts/ci/check-generated.sh contract
      - name: EF Core model has no pending changes (every schema change is a migration)
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Aide.Infrastructure --startup-project src/Aide.Api
          --configuration Release --no-build
      - name: CLI packs as a .NET tool (FR-52)
        run: dotnet pack src/Aide.Cli -c Release --no-build -o "$RUNNER_TEMP/nupkg"
      - name: Test (unit, CLI, integration via Testcontainers)
        run: dotnet test -c Release --no-build --results-directory "${{ github.workspace }}/backend/TestResults" --report-xunit-trx
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (client, typecheck, lint, test, build, route tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Client is up to date (frontend/src/api/generated from the committed api.json)
        run: |
          npm run gen:api
          bash ../scripts/ci/check-generated.sh client
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Route tree is up to date (src/routeTree.gen.ts, regenerated by the build)
        run: bash ../scripts/ci/check-generated.sh routes

  manifests:
    name: Manifests (kustomize render + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # validate-manifests.sh renders a temp COPY of deploy/k8s with secrets.env.example as secrets.env (the real
      # secrets.env is git-ignored and never created here), then runs kubeconform if it is on PATH. The shim runs
      # the pinned kubeconform image (ghcr.io/yannh/kubeconform:v0.8.0); kubectl is preinstalled on the runner.
      - name: Put the kubeconform shim on PATH
        run: |
          chmod +x scripts/ci/shims/kubeconform
          echo "$GITHUB_WORKSPACE/scripts/ci/shims" >> "$GITHUB_PATH"
      - name: Render and validate (same script as the local gate)
        run: |
          kubectl version --client
          command -v kubeconform
          ./deploy/scripts/validate-manifests.sh

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          tags: aide-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # NFR-TEST: Playwright against the dev loop (API on 5080 + Vite dev server on 5173, started by playwright.config.ts).
  # Chromium only; the a11y projects (axe, which build a fully released project first) and the cross-browser
  # projects run locally / on Kubernetes, not here, to keep CI time reasonable.
  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: aide
          POSTGRES_DB: aide
          # Throwaway CI-only database: trust auth, so there is no password anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aide -d aide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__Aide: Host=localhost;Port=5432;Database=aide;Username=aide
      # The committed contract is checked by the backend job; don't rewrite it here.
      OpenApiGenerateDocuments: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the API and apply migrations
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet build src/Aide.Api -c Release
          dotnet ef database update --project src/Aide.Infrastructure --startup-project src/Aide.Api \
            --configuration Release --no-build
      - name: Start the API (Development with seed, Fake LLM provider and no keys, Local Git)
        working-directory: backend/src/Aide.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # Never call a real provider: Fake by default and no provider keys at all.
          Llm__DefaultProvider: fake
          Llm__Providers__Anthropic__ApiKey: ""
          Llm__Providers__OpenAI__ApiKey: ""
          ASPNETCORE_URLS: http://localhost:5080
          Telemetry__ConsoleExporter: "false"
          Workspaces__Root: ${{ runner.temp }}/aide-workspaces
          # Registration/login limits (5/min per IP) are honoured by the specs' register lock; raising them only
          # removes the waiting. Rate limiting itself is covered by the backend integration tests.
          Auth__RateLimits__RegisterPerMinute: "100"
          Auth__RateLimits__LoginPerMinute: "100"
        run: |
          nohup dotnet run -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5080/api/health/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "::error::API did not become ready"; tail -n 100 "$RUNNER_TEMP/api.log"; exit 1
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (chromium project)
        working-directory: frontend
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore
