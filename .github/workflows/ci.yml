# Mirrors the CLAUDE.md gate, plus contract/client freshness, Railway IaC typecheck + actionlint, EF model drift, CLI packaging, manifest validation of both
# overlays (local, local-e2e; kubeconform), shell script checks, image builds with container smoke checks (web: read-only
# root FS, /healthz, CSP nonce, 502 when the API is absent; api: setpriv drop to uid 1654, efbundle as non-root) and
# Playwright E2E against the API + a production Next.js server (`next build && npm start`) in E2E mode (v1 specs, v2 specs and a11y as parallel shards).
# Nothing is pushed: images are built and discarded. No registry, repository or LLM/GitHub secrets are used:
# E2E runs with the offline Fake LLM and Fake deployment providers and the Local Git provider, and the database is a
# throwaway service.
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
  push:
    # build/** too: the commit gate runs on CI, not locally (CLAUDE.md "Commit gate").
    branches: [main, "build/**"]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (build, contract, EF drift, CLI pack, test, format)
    runs-on: ubuntu-latest
    # TEMPORARY (v4 M23/M24 investigation): 45/38 so a slow integration run finishes and writes its TRX timings.
    # Restore 25/18 once the slow test is fixed (PROGRESS.md Known issues).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Build (warnings as errors; regenerates openapi/api.json)
        run: dotnet build -c Release -warnaserror --no-restore
      - name: Contract is up to date (backend/openapi/api.json)
        run: bash ../scripts/ci/check-generated.sh contract
      - name: EF Core model has no pending changes (every schema change is a migration)
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Aide.Infrastructure --startup-project src/Aide.Api
          --configuration Release --no-build
      - name: CLI packs as a .NET tool (FR-52)
        run: dotnet pack src/Aide.Cli -c Release --no-build -o "$RUNNER_TEMP/nupkg"
      - name: Test (unit, CLI)
        timeout-minutes: 5
        run: |
          dotnet test --project tests/Aide.UnitTests -c Release --no-build --results-directory "${{ github.workspace }}/backend/TestResults" --report-xunit-trx
          dotnet test --project tests/Aide.Cli.Tests -c Release --no-build --results-directory "${{ github.workspace }}/backend/TestResults" --report-xunit-trx
      - name: Test (integration via Testcontainers)
        if: false # TEMPORARY: bisected by the backend-integration-bisect job below
        # TEMPORARY (v4 M23/M24 hang investigation): the native xUnit runner prints "[Long Running Test]" with the
        # test name live, so a hang names its test even if the step is killed. Restore `dotnet test` once fixed.
        timeout-minutes: 30
        run: >-
          dotnet tests/Aide.IntegrationTests/bin/Release/net10.0/Aide.IntegrationTests.dll
          -longRunning 60 -noColor -trx "${{ github.workspace }}/backend/TestResults/integration.trx"
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  backend-integration-bisect:
    # TEMPORARY (v4 M23/M24 hang investigation): integration tests split by namespace on separate runners, each with
    # xUnit long-running detection, to find the hang. Remove once fixed and restore the single integration step.
    name: Backend integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: agents
            ns: -namespace Aide.IntegrationTests.Agents -namespace Aide.IntegrationTests.Artifacts -namespace Aide.IntegrationTests.Activity -namespace Aide.IntegrationTests.Admin
          - group: auth-llm
            ns: -namespace Aide.IntegrationTests.Auth -namespace Aide.IntegrationTests.Connections -namespace Aide.IntegrationTests.Llm -namespace Aide.IntegrationTests.Logging
          - group: deploy-exec
            ns: -namespace Aide.IntegrationTests.Deployments -namespace Aide.IntegrationTests.Execution -namespace Aide.IntegrationTests.Gates -namespace Aide.IntegrationTests.Git
          - group: github-live
            ns: -namespace Aide.IntegrationTests.GitHub -namespace Aide.IntegrationTests.Health -namespace Aide.IntegrationTests.Jobs -namespace Aide.IntegrationTests.Lifecycle -namespace Aide.IntegrationTests.Live
          - group: notify-persist
            ns: -namespace Aide.IntegrationTests.Notifications -namespace Aide.IntegrationTests.Persistence
          - group: projects
            ns: -namespace Aide.IntegrationTests.Presets -namespace Aide.IntegrationTests.Projects -namespace Aide.IntegrationTests.Stack -namespace Aide.IntegrationTests.Seed
          - group: releases
            ns: -namespace Aide.IntegrationTests.Releases -namespace Aide.IntegrationTests.Review -namespace Aide.IntegrationTests.Rollback -namespace Aide.IntegrationTests.Stages -namespace Aide.IntegrationTests.Versions
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build tests/Aide.IntegrationTests -c Release --no-restore
      - name: Integration tests (${{ matrix.group }})
        timeout-minutes: 22
        run: >-
          dotnet tests/Aide.IntegrationTests/bin/Release/net10.0/Aide.IntegrationTests.dll
          ${{ matrix.ns }} -longRunning 60 -noColor -trx "${{ github.workspace }}/backend/TestResults/${{ matrix.group }}.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.group }}
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (client, typecheck, lint, test, Next.js build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Client is up to date (frontend/src/api/generated from the committed api.json)
        run: |
          npm run gen:api
          bash ../scripts/ci/check-generated.sh client
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Next.js build cache (.next/cache): keyed on the lockfile and sources, falls back to the lockfile-only key.
      - uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/*.ts', 'frontend/*.mjs', 'frontend/public/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm run build

  manifests:
    name: Manifests (kustomize render + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # validate-manifests.sh renders a temp COPY of deploy/k8s with secrets.env.example as secrets.env (the real
      # secrets.env is git-ignored and never created here), then runs kubeconform if it is on PATH. The shim runs
      # the pinned kubeconform image (ghcr.io/yannh/kubeconform:v0.8.0); kubectl is preinstalled on the runner.
      - name: Put the kubeconform shim on PATH
        run: |
          chmod +x scripts/ci/shims/kubeconform
          echo "$GITHUB_WORKSPACE/scripts/ci/shims" >> "$GITHUB_PATH"
      # Renders and kubeconform-validates BOTH variants: overlays/local (normal deploy) and overlays/local-e2e
      # (deploy-local.sh --e2e), with the script's guards that Fake deployments and the Local import root appear only
      # in the E2E variant. The checks below make sure neither render is silently dropped from the script.
      - name: Render and validate both overlays (same script as the local gate)
        run: |
          kubectl version --client
          command -v kubeconform
          ./deploy/scripts/validate-manifests.sh | tee "$RUNNER_TEMP/validate.log"
          for overlay in overlays/local overlays/local-e2e; do
            grep -qE "^kustomize: $overlay rendered [1-9]" "$RUNNER_TEMP/validate.log" \
              || { echo "::error::$overlay was not rendered by validate-manifests.sh"; exit 1; }
          done
          test "$(grep -c '^Summary:' "$RUNNER_TEMP/validate.log")" -eq 2 \
            || { echo "::error::kubeconform did not validate both renders"; exit 1; }

  scripts:
    name: Shell scripts (bash -n / sh -n, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax (bash -n)
        run: |
          for f in deploy/scripts/*.sh scripts/ci/*.sh scripts/ci/shims/*; do
            echo "bash -n $f"
            bash -n "$f"
          done
          # POSIX sh (the API image's entrypoint, FR-106): parse it as sh, not bash.
          echo "sh -n backend/entrypoint.sh"
          sh -n backend/entrypoint.sh
      # Error severity only: the deploy scripts carry warning/style findings that are not bugs (lib.sh variables
      # used by the scripts that source it). Pinned image, so local runs match.
      - name: shellcheck (severity error)
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S error -x
          deploy/scripts/*.sh scripts/ci/*.sh scripts/ci/shims/*
      # The entrypoint is POSIX sh (dash-compatible) and new in v3: checked as sh, warnings included.
      - name: shellcheck backend/entrypoint.sh (sh, severity warning)
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -s sh -S warning
          backend/entrypoint.sh

  # FR-107 / FR-110 (CI side): keeps the Railway IaC and the workflows from rotting before the first deploy. No Railway
  # auth and no railway CLI commands: the IaC is only installed and typechecked. actionlint checks every workflow,
  # with shellcheck (bundled in the pinned image) on each run: block, so the job runs whenever .github/** changes too.
  railway-workflows:
    name: Railway IaC + workflows (typecheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci --prefix .railway
      - name: Typecheck the Railway IaC (.railway/railway.ts)
        run: npm --prefix .railway run typecheck
      # Pinned image, so local runs match (`actionlint -shellcheck=<shellcheck 0.11>` gives the same result).
      - name: actionlint (.github/workflows/*.yml, shellcheck on run blocks)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push; loaded into the runner's Docker for the smoke checks)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: aide-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # FR-103: the standalone Next server on PORT 8080 with a read-only root FS and only /tmp writable (as on
      # Kubernetes and Railway). BACKEND_URL points at a closed port, so the /api proxy must answer 502.
      - name: Smoke the web container (read-only root FS, /healthz, CSP nonce, 502 without the API)
        if: matrix.image == 'web'
        run: |
          docker run -d --name aide-web --read-only --tmpfs /tmp \
            -e PORT=8080 -e BACKEND_URL=http://127.0.0.1:9 -p 8080:8080 aide-web:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://localhost:8080/healthz 2>/dev/null || true)" = "ok" ]; then ready=1; break; fi
            sleep 1
          done
          [ "${ready:-}" = 1 ] || { echo "::error::/healthz did not return ok"; exit 1; }
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/login.headers" -w '%{http_code}' http://localhost:8080/login)"
          [ "$code" = 200 ] || { echo "::error::/login returned $code, expected 200"; exit 1; }
          grep -i '^content-security-policy:' "$RUNNER_TEMP/login.headers" | grep -q "'nonce-" \
            || { echo "::error::/login has no Content-Security-Policy with a nonce"; cat "$RUNNER_TEMP/login.headers"; exit 1; }
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/health/ready)"
          [ "$code" = 502 ] || { echo "::error::/api/health/ready returned $code with the API absent, expected 502"; exit 1; }
          echo "web container smoke passed"
      # FR-106: the image starts as root, the entrypoint hands /data to uid 1654 and drops to it with setpriv; the
      # migration bundle must run directly as uid 1654 (Kubernetes migrate Job) with only /tmp writable. /tmp is mounted
      # exec (like a Kubernetes emptyDir; docker's --tmpfs default is noexec) because the bundle extracts into it.
      - name: Smoke the api container (entrypoint, setpriv drop, efbundle as non-root)
        if: matrix.image == 'api'
        run: |
          docker run --rm --entrypoint sh aide-api:ci -c 'command -v setpriv && test -x /app/entrypoint.sh'
          ids="$(docker run --rm aide-api:ci sh -c 'echo "$(id -u) $(stat -c %u /data/keys) $(stat -c %u /data/workspaces)"')"
          [ "$ids" = "1654 1654 1654" ] \
            || { echo "::error::expected uid 1654 and /data/keys, /data/workspaces owned by 1654; got '$ids'"; exit 1; }
          docker run --rm --user 1654 --read-only --tmpfs /tmp:exec,size=512m aide-api:ci /app/efbundle --help > /dev/null
          echo "api container smoke passed"
      - name: Container logs
        if: failure() && matrix.image == 'web'
        run: docker logs aide-web || true

  # NFR-TEST / NFR-TEST2 / NFR-A11Y2: Playwright against the API on 5080 + the production Next.js server on 3000
  # (`npm run build && npm start` = node server.ts, started by playwright.config.ts's webServer because BASE_URL is unset
  # and CI is set; it proxies /api and the SignalR WebSockets to BACKEND_URL), in E2E mode: Fake LLM, Fake deployments, Local Git with an import root holding the seeded
  # "existing" repo (same content as deploy/scripts/seed-e2e-repo.sh, seeded locally: no kubectl in CI).
  # Three parallel shards, each with its own throwaway database and API:
  #   v1    chromium, every spec except the v2 and a11y ones (new specs land here automatically)
  #   v2    chromium, versions + import + preset (the long agent-driven flows)
  #   a11y  the a11y project (axe; its a11y-setup dependency builds a released project first)
  # Firefox/WebKit/Edge run locally / on Kubernetes, not here, to keep CI time reasonable.
  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [v1, v2, a11y]
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: aide
          POSTGRES_DB: aide
          # Throwaway CI-only database: trust auth, so there is no password anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aide -d aide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__Aide: Host=localhost;Port=5432;Database=aide;Username=aide
      # The committed contract is checked by the backend job; don't rewrite it here.
      OpenApiGenerateDocuments: "false"
      # frontend/e2e/import.spec.ts types this absolute path into the wizard (same as on Kubernetes).
      AIDE_IMPORT_ROOT: /data/import
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Seed the Local import repo (existing-app, tags v0.1.0 and v0.2.0)
        run: |
          sudo mkdir -p "$AIDE_IMPORT_ROOT"
          sudo chown "$(id -u):$(id -g)" "$AIDE_IMPORT_ROOT"
          bash scripts/ci/seed-e2e-repo-local.sh "$AIDE_IMPORT_ROOT"
      - name: Build the API and apply migrations
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet build src/Aide.Api -c Release
          dotnet ef database update --project src/Aide.Infrastructure --startup-project src/Aide.Api \
            --configuration Release --no-build
      - name: Start the API (Development + seed, E2E mode, no provider keys)
        working-directory: backend/src/Aide.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
          App__PublicBaseUrl: http://localhost:3000
          Telemetry__ConsoleExporter: "false"
          Workspaces__Root: ${{ runner.temp }}/aide-workspaces
          # Never call a real provider: Fake by default and no provider keys at all.
          Llm__DefaultProvider: fake
          Llm__Providers__Anthropic__ApiKey: ""
          Llm__Providers__OpenAI__ApiKey: ""
          # Same E2E settings as deploy/k8s/overlays/local-e2e: Fake deployments for Local Git projects (§4.15),
          # Local import under the seeded root (FR-73).
          Deployments__Provider: Fake
          Deployments__AllowFake: "true"
          Git__Local__ImportRoot: ${{ env.AIDE_IMPORT_ROOT }}
          # Registration/login limits (5/min per IP) are honoured by the specs' register lock; raising them only
          # removes the waiting. Rate limiting itself is covered by the backend integration tests.
          Auth__RateLimits__RegisterPerMinute: "100"
          Auth__RateLimits__LoginPerMinute: "100"
        run: |
          nohup dotnet run -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          # /api/health/ready also fails if an embedded tech stack preset doesn't load.
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5080/api/health/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "::error::API did not become ready"; tail -n 100 "$RUNNER_TEMP/api.log"; exit 1
      # The a11y admin-integrations scan needs an Admin. The dev seeder creates admin@aide.local on this fresh
      # database and logs its generated password once; it is masked here and dies with the throwaway database.
      - name: Expose the seeded admin to the a11y project
        if: matrix.suite == 'a11y'
        run: |
          for _ in $(seq 1 30); do
            password="$(grep -oE '"Password": ?"[A-Za-z0-9]+"' "$RUNNER_TEMP/api.log" | head -n 1 | cut -d'"' -f4 || true)"
            if [ -n "$password" ]; then
              echo "::add-mask::$password"
              { echo "E2E_ADMIN_EMAIL=admin@aide.local"; echo "E2E_ADMIN_PASSWORD=$password"; } >> "$GITHUB_ENV"
              echo "Seeded admin found"; exit 0
            fi
            sleep 1
          done
          echo "::warning::Seeded admin password not found in the API log; the admin-integrations a11y scan will skip."
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (${{ matrix.suite }})
        working-directory: frontend
        env:
          SUITE: ${{ matrix.suite }}
          # BASE_URL stays unset: playwright.config.ts then defaults to http://localhost:3000 and (CI=true) runs `npm run build && npm start`.
          BACKEND_URL: http://localhost:5080
        run: |
          v2_specs='versions|import|preset'
          case "$SUITE" in
            v1)
              mapfile -t specs < <(find e2e -maxdepth 1 -name '*.spec.ts' | sort | grep -vE "/(a11y|$v2_specs)\.spec\.ts$")
              echo "v1 specs: ${specs[*]}"
              npx playwright test --project=chromium "${specs[@]}"
              ;;
            v2)
              npx playwright test --project=chromium e2e/versions.spec.ts e2e/import.spec.ts e2e/preset.spec.ts
              ;;
            a11y)
              npx playwright test --project=a11y
              ;;
            *)
              echo "::error::unknown suite $SUITE"; exit 1
              ;;
          esac
      # ::add-mask:: only masks console output, so scrub the seeded admin's password from the API log before it is
      # uploaded. The seeder logs it as the JSON state field "Password" and inside the rendered "with password <pw>".
      # The bracketed first letter ([P]assword) matches exactly the same text; it only stops secret scanners from
      # reading these patterns as a hard-coded password.
      - name: Redact secrets from the API log
        if: failure()
        run: |
          log="$RUNNER_TEMP/api.log"
          [ -f "$log" ] || exit 0
          sed -i -E \
            -e 's/("[P]assword"[[:space:]]*:[[:space:]]*")[^"]*"/\1***REDACTED***"/Ig' \
            -e 's/(with [p]assword )[^ ",]+/\1***REDACTED***/Ig' \
            "$log" || true
          if grep -qiE '"[P]assword"[[:space:]]*:[[:space:]]*"[^*"]|with [p]assword [^*]' "$log"; then
            echo "::warning::API log may still contain a password; dropping it from the artifact."
            : > "$log"
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.suite }}
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore
